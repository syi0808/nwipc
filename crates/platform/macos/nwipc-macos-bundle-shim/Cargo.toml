[package]
name = "nwipc-macos-bundle-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.nwipc]
layer = "platform"
stability = "experimental"
owner = "nwipc"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
e2e-fault-injection = ["nwipc-macos-transport/fault-injection"]

[dependencies]
nwipc-bootstrap-codec.workspace = true
nwipc-error.workspace = true
nwipc-macos-bundle-api.workspace = true
nwipc-macos-transport.workspace = true
nwipc-renderer-api.workspace = true
nwipc-renderer-bootstrap.workspace = true
nwipc-renderer-jsc = { path = "../../../renderer/nwipc-renderer-jsc" }
nwipc-types.workspace = true
nwipc-webkit-testkit.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

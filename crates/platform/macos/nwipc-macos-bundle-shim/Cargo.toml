[package]
name = "nwipc-macos-bundle-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.nwipc]
layer = "platform"
stability = "experimental"
owner = "nwipc"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nwipc-error.workspace = true
nwipc-macos-bundle-api.workspace = true
nwipc-memory-api.workspace = true
nwipc-memory-iosurface.workspace = true
nwipc-types.workspace = true
nwipc-webkit-testkit.workspace = true

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
  "crates/facade/nwipc",
  "crates/domain/*",
  "crates/protocol/*",
  "crates/data-plane/*",
  "crates/memory/*",
  "crates/signal/*",
  "crates/bootstrap/*",
  "crates/runtime/*",
  "crates/peer/*",
  "crates/renderer/*",
  "crates/platform/macos/*",
  "crates/adapters/*",
  "crates/observability/*",
  "crates/testing/*",
  "examples/native-peer",
  "examples/macos-appkit",
  "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nwipc-error = { version = "=0.0.0", path = "crates/domain/nwipc-error" }
nwipc-layout = { version = "=0.0.0", path = "crates/protocol/nwipc-layout" }
nwipc-record = { version = "=0.0.0", path = "crates/protocol/nwipc-record" }
nwipc-protocol = { version = "=0.0.0", path = "crates/protocol/nwipc-protocol" }
nwipc-validation = { version = "=0.0.0", path = "crates/protocol/nwipc-validation" }
nwipc-types = { version = "=0.0.0", path = "crates/domain/nwipc-types" }
nwipc-atomic = { version = "=0.0.0", path = "crates/data-plane/nwipc-atomic" }
nwipc-ring-core = { version = "=0.0.0", path = "crates/data-plane/nwipc-ring-core" }
nwipc-ring-writer = { version = "=0.0.0", path = "crates/data-plane/nwipc-ring-writer" }
nwipc-ring-reader = { version = "=0.0.0", path = "crates/data-plane/nwipc-ring-reader" }
nwipc-flow-control = { version = "=0.0.0", path = "crates/data-plane/nwipc-flow-control" }
nwipc-channel-core = { version = "=0.0.0", path = "crates/data-plane/nwipc-channel-core" }
nwipc-channel-transport = { version = "=0.0.0", path = "crates/data-plane/nwipc-channel-transport" }
nwipc-crypto = { version = "=0.0.0", path = "crates/data-plane/nwipc-crypto" }
nwipc-fragment = { version = "=0.0.0", path = "crates/data-plane/nwipc-fragment" }
nwipc-bootstrap-schema = { version = "=0.0.0", path = "crates/bootstrap/nwipc-bootstrap-schema" }
nwipc-bootstrap-codec = { version = "=0.0.0", path = "crates/bootstrap/nwipc-bootstrap-codec" }
nwipc-peer-bootstrap = { version = "=0.0.0", path = "crates/bootstrap/nwipc-peer-bootstrap" }
nwipc-peer-core = { version = "=0.0.0", path = "crates/peer/nwipc-peer-core" }
nwipc-peer-async = { version = "=0.0.0", path = "crates/peer/nwipc-peer-async" }
nwipc-peer-tokio = { version = "=0.0.0", path = "crates/peer/nwipc-peer-tokio" }
nwipc-memory-api = { version = "=0.0.0", path = "crates/memory/nwipc-memory-api" }
nwipc-memory-iosurface = { version = "=0.0.0", path = "crates/memory/nwipc-memory-iosurface" }
nwipc-memory-mach = { version = "=0.0.0", path = "crates/memory/nwipc-memory-mach" }
nwipc-signal-api = { version = "=0.0.0", path = "crates/signal/nwipc-signal-api" }
nwipc-signal-poll = { version = "=0.0.0", path = "crates/signal/nwipc-signal-poll" }
nwipc-renderer-api = { version = "=0.0.0", path = "crates/renderer/nwipc-renderer-api" }
nwipc-renderer-core = { version = "=0.0.0", path = "crates/renderer/nwipc-renderer-core" }
nwipc-renderer-bootstrap = { version = "=0.0.0", path = "crates/bootstrap/nwipc-renderer-bootstrap" }
nwipc-capabilities = { version = "=0.0.0", path = "crates/domain/nwipc-capabilities" }
nwipc-macos-artifact = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-artifact" }
nwipc-macos-bundle = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-bundle" }
nwipc-macos-bundle-api = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-bundle-api" }
nwipc-macos-host = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-host" }
nwipc-macos-spi = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-spi" }
nwipc-state = { version = "=0.0.0", path = "crates/domain/nwipc-state" }
nwipc-session = { version = "=0.0.0", path = "crates/runtime/nwipc-session" }
nwipc-session-machine = { version = "=0.0.0", path = "crates/runtime/nwipc-session-machine" }
nwipc-runtime = { version = "=0.0.0", path = "crates/runtime/nwipc-runtime" }
nwipc-signal-darwin = { version = "=0.0.0", path = "crates/signal/nwipc-signal-darwin" }
nwipc-signal-mach = { version = "=0.0.0", path = "crates/signal/nwipc-signal-mach" }
nwipc-signal-hybrid = { version = "=0.0.0", path = "crates/signal/nwipc-signal-hybrid" }
nwipc-metrics = { version = "=0.0.0", path = "crates/observability/nwipc-metrics" }
nwipc-diagnostics = { version = "=0.0.0", path = "crates/observability/nwipc-diagnostics" }
nwipc-testkit = { version = "=0.0.0", path = "crates/testing/nwipc-testkit" }
nwipc-process-testkit = { version = "=0.0.0", path = "crates/testing/nwipc-process-testkit" }
nwipc-webkit-testkit = { version = "=0.0.0", path = "crates/testing/nwipc-webkit-testkit" }
nwipc-macos-transport = { version = "=0.0.0", path = "crates/platform/macos/nwipc-macos-transport" }
nwipc-mach-transfer = { version = "=0.0.0", path = "crates/platform/macos/nwipc-mach-transfer" }
nwipc-mach-rendezvous = { version = "=0.0.0", path = "crates/platform/macos/nwipc-mach-rendezvous" }
nwipc-appkit = { version = "=0.0.0", path = "crates/adapters/nwipc-appkit" }
nwipc-wry = { version = "=0.0.0", path = "crates/adapters/nwipc-wry" }
nwipc-tauri = { version = "=0.0.0", path = "crates/adapters/nwipc-tauri" }
nwipc = { version = "=0.0.0", path = "crates/facade/nwipc" }
tokio = { version = "1", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nwipc_docsrs)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

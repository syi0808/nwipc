[workspace]
resolver = "2"
members = [
  "crates/facade/nwipc",
  "crates/domain/*",
  "crates/protocol/*",
  "crates/data-plane/*",
  "crates/memory/*",
  "crates/signal/*",
  "crates/bootstrap/*",
  "crates/runtime/*",
  "crates/peer/*",
  "crates/renderer/*",
  "crates/platform/macos/*",
  "crates/adapters/*",
  "crates/observability/*",
  "crates/testing/*",
  "examples/native-peer",
  "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nwipc-error = { version = "=0.0.0", path = "crates/domain/nwipc-error" }
nwipc-layout = { version = "=0.0.0", path = "crates/protocol/nwipc-layout" }
nwipc-types = { version = "=0.0.0", path = "crates/domain/nwipc-types" }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nwipc_docsrs)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

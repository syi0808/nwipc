[package]
name = "nwipc-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nwipc-bootstrap-codec = { path = "../crates/bootstrap/nwipc-bootstrap-codec" }
nwipc-capabilities = { path = "../crates/domain/nwipc-capabilities" }
nwipc-crypto = { path = "../crates/data-plane/nwipc-crypto" }
nwipc-fragment = { path = "../crates/data-plane/nwipc-fragment" }
nwipc-layout = { path = "../crates/protocol/nwipc-layout" }
nwipc-protocol = { path = "../crates/protocol/nwipc-protocol" }
nwipc-record = { path = "../crates/protocol/nwipc-record" }
nwipc-types = { path = "../crates/domain/nwipc-types" }
nwipc-validation = { path = "../crates/protocol/nwipc-validation" }

[[bin]]
name = "record"
path = "fuzz_targets/record.rs"

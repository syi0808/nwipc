[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  "RUSTSEC-2026-0009",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

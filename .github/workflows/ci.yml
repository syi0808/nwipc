name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cross-architecture-fixtures:
    name: Cross-architecture fixtures (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Assert runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"
      - run: rustup show active-toolchain
      - name: Verify shared wire fixtures
        run: >-
          cargo test
          -p nwipc-layout -p nwipc-record -p nwipc-protocol
          -p nwipc-bootstrap-codec -p nwipc-validation
          -p nwipc-diagnostics -p nwipc-metrics

  rust-core:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - run: cargo xtask hardening-check

  jsc-lifecycle:
    name: JSC lifecycle stability
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain
      - name: Repeat document lifecycle suite
        run: |
          for run in {1..25}; do
            echo "JSC lifecycle run ${run}/25"
            cargo test -p nwipc-renderer-jsc platform::tests:: -- --test-threads=1
          done

  ts-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

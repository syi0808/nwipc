name: Hardening

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 17 * * 3"

permissions:
  contents: read

jobs:
  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri test -p nwipc-atomic
      - run: cargo +nightly miri test -p nwipc-ring-core
      - run: cargo +nightly miri test -p nwipc-ring-writer
      - run: cargo +nightly miri test -p nwipc-ring-reader borrows_then_consumes
      - run: cargo +nightly miri test -p nwipc-fragment
      - run: cargo +nightly miri test -p nwipc-channel-core dropped_signal

  address-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: >-
          RUSTFLAGS="-Zsanitizer=address" RUSTDOCFLAGS="-Zsanitizer=address"
          cargo +nightly test --target x86_64-unknown-linux-gnu
          -p nwipc-layout -p nwipc-record -p nwipc-bootstrap-codec
          -p nwipc-protocol -p nwipc-validation
          -p nwipc-atomic -p nwipc-ring-core -p nwipc-ring-writer
          -p nwipc-ring-reader -p nwipc-fragment -p nwipc-channel-core

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --locked
      - run: cargo +nightly fuzz run record -- -max_total_time=30
      - run: cargo +nightly fuzz run bootstrap -- -max_total_time=30
      - run: cargo +nightly fuzz run layout -- -max_total_time=30
      - run: cargo +nightly fuzz run fragment -- -max_total_time=30
      - run: cargo +nightly fuzz run protocol -- -max_total_time=30
      - run: cargo +nightly fuzz run validation -- -max_total_time=30
      - run: cargo +nightly fuzz run crypto -- -max_total_time=30
